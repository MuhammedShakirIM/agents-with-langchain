[project]
name = "learning-companion"
version = "0.1.0"
description = "Learning Companion Chatbot for Open WebUI, powered by LangChain and Grok."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-xai>=1.3.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
learning-companion = "learning_companion.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_companion"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
